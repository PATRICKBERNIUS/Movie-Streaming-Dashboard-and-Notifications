name: Weekly streaming availability check

on:
  schedule:
    # Runs every Friday at 15:00 UTC — adjust the hour for your timezone.
    # (UTC time zone converter: https://www.timeanddate.com/worldclock/converter.html)
    - cron: "0 15 * * 5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run availability check
        env:
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ONLY_NEW: "false"
        run: python check_availability.py

      - name: Save updated state
        run: |
          git config user.name "streaming-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_state.json
          git diff --staged --quiet || git commit -m "Update seen_state.json"
          git push
